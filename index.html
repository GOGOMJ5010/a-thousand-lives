.pbar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);transition:width .35s}

.opt:hover,.opt:focus-visible{border-color:var(--ink);outline:none}

.nums span{font-size:11px;color:var(--mute)}
#st{z-index:0;transition:opacity .55s}#st.off{opacity:0}
#cv{mix-blend-mode:screen;z-index:1;pointer-events:none}
#hero{display:block;height:360vh;min-height:0;padding-bottom:0}

.pin .wrap{width:100%}
.pin{position:sticky}
.tops{position:absolute;top:70px;left:18px;right:18px;display:flex;justify-content:space-between;gap:28px;font-size:12px;line-height:1.45;color:#fff}
.tops p{margin:0;max-width:150px}.tops p:last-child{text-align:right}
h1 em{font-family:"Instrument Serif","Nanum Myeongjo",serif;font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:-.01em}
:lang(ko) h1 em{font-style:normal;font-weight:700;font-size:1.02em}
#sline,#sline2{font-size:clamp(30px,7vw,54px);text-shadow:0 1px 18px rgba(40,40,70,.35)}
#sline2{position:absolute;top:74px;left:18px;right:18px;margin:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.gc{background:rgba(70,72,98,.34);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.24);border-radius:12px;padding:10px 12px 12px;font-size:12px;line-height:1.4;color:#fff}

.pin>*,.pin .wrap>*{transition:opacity .5s}

.pin.s1 #sline,.pin.s2 #sline{height:0;min-height:0;margin:0;overflow:hidden}

<canvas id="cv"></canvas>

<header><div class="brand">A Thousand Lives</div><div><button class="pill solid hide" id="resume"></button> <button class="pill hide" id="again" data-t="again"></button> <button class="pill" id="lang"></button></div></header>
<main>
<section id="hero">

  <div class="wrap">

  <div id="sbtn"><button class="pill solid" id="begin" data-t="begin"></button></div>
  <div class="scroll" id="shint" data-t="scroll"></div>
  </div></div>
</section>

<section id="iv" class="hide"><div class="wrap">
  <div class="prog"><button class="pill" id="back">←</button><span id="pn"></span><div class="pbar"><i id="pb"></i></div></div>

  <div class="opts" id="opts"></div>
  <div class="ivnote" id="ivnote"></div>
</div></section>

<section id="stage" class="hide">

  <div class="hint hide" id="hint" data-t="hint"></div>
</section>

<section id="after" class="hide"><div class="wrap">
  <div class="bars">
    <div class="bar"><b id="n1"></b><span data-t="c1"></span></div>

  </div>
  <div id="detail" class="hide">
    <h2 data-t="dh2"></h2>
    <div class="dh" id="dh"></div><div class="tag" id="dtag"></div>
    <ul class="tl" id="dtl"></ul>
    <div class="qs" id="dqs"></div>
    <div class="ans hide" id="dans"></div>
  </div>
  <div id="livebox"><h2 data-t="liveh"></h2>
  <p class="lead" data-t="livep"></p>
  <div class="leftn" id="leftn"></div>
  <div class="leftl" id="leftl"></div>
  <canvas id="trk"></canvas>
  <p class="note" id="trkleg" style="margin:6px 0 4px"></p>
  <div id="liveq"></div>
  <h2 data-t="forel"></h2>
  <div id="liverep"></div>
  <h2 id="pasth" data-t="pastl"></h2>
  <div id="past"></div>
  <div id="livemsg"></div></div>
  <h2 data-t="askh"></h2>
  <p class="lead" data-t="askp"></p>
  <div class="qs" id="askq" style="margin-top:0"></div>
  <div id="askr"></div>
  <div id="debate"></div>
  <h2 data-t="nh"></h2>
  <div id="facts"></div>
  <h2 data-t="ih"></h2>
  <div class="nums" id="nums"></div>
  <div id="cfwrap"><h2 data-t="fh"></h2>
  <div id="finds"></div></div>
  <h2 data-t="srch"></h2>
  <div id="src"></div>
  <p class="note" data-t="note"></p>
</div></section>

<section id="final" class="hide"><div class="wrap">

  <p class="lead" id="finp"></p>
  <div class="tag" id="fint"></div>
  <ul class="tl" id="fintl"></ul>
  <div class="ans" id="fina"></div>
  <button class="pill" id="finb" data-t="finb"></button>
</div></section>

function simG(a,from){
  const S=G,r=rng(20261030),g=()=>{let u=0;for(let i=0;i<6;i++)u+=r();return u-3};
  let pF=1;S.questions.forEach((Q,i)=>{pF*=Q.risk[a["g"+i]]??1});pF=Math.max(.4,Math.min(2.2,pF));
  const H=S.hazard.map(h=>Math.min(.6,h*pF));if(a===A)haz=H;
  const inc0=S.start,I=0,plan=y=>Math.min(cap0,inc0*Math.pow(1+Math.max(0,S.growth),y-1)),cap0=S.cap,limit=[.5,1,2,99][a.limit],hor=[2,3,5,99][a.hor],g0=S.growth,vol=S.vol,cap=S.cap;
  const out=[];base=[];for(let y=0;y<=10;y++)base.push(idx(stay(y),.5));
  const y0=from?Math.max(1,Math.min(9,Math.round(from.t))):0,fp=from?[[0,inc0]].concat(from.pts):null;
  const pathV=y=>{let k=0;while(k<fp.length-1&&fp[k+1][0]<y)k++;if(k>=fp.length-1)return fp[fp.length-1][1];const a=fp[k],b=fp[k+1];return a[1]+(b[1]-a[1])*Math.max(0,Math.min(1,(y-a[0])/Math.max(.01,b[0]-a[0])))};
  for(let i=0;i<1000;i++){
    const l={n:i+1,pv:0,willPiv:r()<.5,closed:0,why:"",line:0,beat:0,hard:1,ev:[],p:[base[0]],iy:[1],loss:I};
    let inc=inc0,sat=.6,biz=true,worst=9;
    if(from){for(let y=1;y<=y0;y++){const v=pathV(y);l.iy.push(v);l.p.push(idx(v,.6));if(!l.beat&&v>=stay(y))l.beat=y}inc=Math.max(.1,from.inc*(1+g()*.08));l.iy[y0]=inc;if(from.pv)l.pv=y0;l.loss=Math.max(0,(inc0+plan(Math.max(1,y0)))/2-(inc0+from.inc)/2)*from.t}
    for(let y=y0+1;y<=10;y++){
      if(biz){
        const p=H[y-1];let why="";
        if(r()<p){if(l.willPiv&&!l.pv&&r()<.55){l.pv=y;inc*=.85;l.ev.push([y,"pivot"])}else why="fail"}
        else if(y>1){const gr=g0+g()*vol;inc=Math.min(cap,Math.max(.1,inc*(1+gr)));l.ev.push([y,gr>.05?"grow":"flat",inc])}
        else{inc=Math.max(.1,inc*(1+g()*.15));l.ev.push([1,"quit",inc])}
        if(!why){const b=stay(y),pl=plan(y);l.loss+=Math.max(0,pl-inc);l.loss=Math.max(0,l.loss-Math.max(0,inc-pl)*.5);
          if(l.loss>limit)why="line";else if(y>=hor&&inc<Math.min(b,pl)*.7)why="hor";
          if(!l.beat&&inc>=b)l.beat=y;if(inc-b<worst){worst=inc-b;l.hard=y}}
        if(why){biz=false;l.closed=y;l.hard=y;l.why=why;if(l.loss>limit)l.line=y;l.ev.push([y,why,0,Math.round(H[y-1]*1000)/10]);inc=S.fallback*stay(y);sat=.4}
        else sat=Math.max(.2,Math.min(.95,.55+Math.min(inc,2.5)*.14-(inc<stay(y)*.8?.1:0)+g()*.05));
      }else{inc*=1.03+g()*.015;sat=Math.min(.58,sat+.025);if(y===10)l.ev.push([y,"job",inc])}
      l.p.push(idx(inc,sat)+g()*.01);l.iy.push(inc);
    }
    l.inc=inc;l.biz=biz;l.cls=l.line?2:(biz&&inc>=stay(10)*.95)?0:1;
    l.again=r()<[.93,.5,.14][l.cls];
    const f1=r(),f2=r();l.ct=l.closed?Math.max(from?from.t+.05:0,l.closed-1+f1):99;l.pt=l.pv?l.pv-1+f2:99;
    l.reg=l.cls===0?(l.beat&&l.beat<=3?"none":"sooner"):l.why==="line"?"late":"luck";
    out.push(l);
  }
  return out;
}
